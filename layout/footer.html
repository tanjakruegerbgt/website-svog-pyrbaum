<footer class="site-footer">
  <div class="footer-identity brand-identity">
    <a class="footer-brand" href="{{homeHref}}" aria-label="{{homeLabel}}">
      {{logo}}
      <span class="brand-copy">
        <span class="brand-association">Verein für dt. Schäferhunde</span>
        <span class="brand-local"><strong>Ortsgruppe Pyrbaum e. V.</strong></span>
      </span>
    </a>
    <span class="brand-stamp"><span>seit</span> <span>1984</span></span>
  </div>
  <nav class="footer-links" aria-label="Footer-Navigation">
    <a href="{{ctaHref}}">{{ctaText}} <span class="link-arrow" aria-hidden="true">→</span></a>
    <a href="/impressum"{{imprintCurrent}} data-imprint-dialog>Impressum</a>
    <a href="/datenschutz"{{privacyCurrent}} data-privacy-dialog>Datenschutz</a>
  </nav>
</footer>
<dialog class="imprint-dialog" aria-labelledby="imprint-dialog-title">
  <div class="imprint-dialog-header">
    <h2 id="imprint-dialog-title">Impressum</h2>
    <button type="button" class="imprint-dialog-close" aria-label="Dialog schließen" autofocus>&times;</button>
  </div>
  <iframe class="imprint-dialog-content" title="Impressum"></iframe>
</dialog>
<script src="/js/imprint-dialog.js" defer></script>
